# Milvus 분산 클러스터 — 로컬 테스트용 (QueryNode 2개)
#
# 사용법:
#   docker-compose -f deploy/docker-compose.dist.yml up -d
#   # 클러스터 준비 확인
#   curl -sf http://localhost:9091/healthz && echo "ready"
#   # 벤치마크 실행 (로컬 Python 환경에서)
#   python -m bench.dist_bench \
#     --milvus-uri http://localhost:19530 \
#     --num-shards 1 2 \
#     --replica-number 1 2 \
#     --search-workers 1 2
#
# QueryNode 추가 스케일아웃:
#   docker-compose -f deploy/docker-compose.dist.yml up -d --scale querynode=4

services:

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >
      /usr/local/bin/etcd
      --name=default
      --data-dir=/etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --advertise-peer-urls=http://etcd:2380
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-cluster=default=http://etcd:2380
      --initial-cluster-state=new
      --initial-cluster-token=etcd-cluster
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /data --console-address ":9001"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb local/milvus-bucket --ignore-existing;
        echo 'minio bucket ready';
      "
    restart: "no"

  mixcoord:
    image: milvusdb/milvus:v2.6.9
    command: ["milvus", "run", "mixcoord"]
    depends_on:
      etcd:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./configs/milvus_dist.yaml:/milvus/configs/milvus.yaml:ro
    restart: on-failure

  streamingnode:
    image: milvusdb/milvus:v2.6.9
    command: ["milvus", "run", "streamingnode"]
    depends_on:
      - mixcoord
    volumes:
      - ./configs/milvus_dist.yaml:/milvus/configs/milvus.yaml:ro
    restart: on-failure

  proxy:
    image: milvusdb/milvus:v2.6.9
    command: ["milvus", "run", "proxy"]
    depends_on:
      - mixcoord
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./configs/milvus_dist.yaml:/milvus/configs/milvus.yaml:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  datanode:
    image: milvusdb/milvus:v2.6.9
    command: ["milvus", "run", "datanode"]
    depends_on:
      - mixcoord
    volumes:
      - ./configs/milvus_dist.yaml:/milvus/configs/milvus.yaml:ro
    restart: on-failure

  # QueryNode — `--scale querynode=N` 으로 수평 확장 가능
  querynode:
    image: milvusdb/milvus:v2.6.9
    command: ["milvus", "run", "querynode"]
    depends_on:
      - mixcoord
    volumes:
      - ./configs/milvus_dist.yaml:/milvus/configs/milvus.yaml:ro
    restart: on-failure

volumes:
  etcd_data:
  minio_data:
